name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
      - run: uv run ruff check src/ tests/

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version consistency
        run: |
          PYPROJECT=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          INIT=$(grep '__version__' src/neurostack/__init__.py | sed 's/.*"\(.*\)"/\1/')
          NPM=$(node -p "require('./npm/package.json').version")
          echo "pyproject.toml: $PYPROJECT"
          echo "__init__.py:    $INIT"
          echo "npm/package.json: $NPM"
          if [ "$PYPROJECT" != "$INIT" ]; then
            echo "::error::Version mismatch: pyproject.toml ($PYPROJECT) != __init__.py ($INIT)"
            exit 1
          fi
          if [ "$PYPROJECT" != "$NPM" ]; then
            echo "::error::Version mismatch: pyproject.toml ($PYPROJECT) != npm/package.json ($NPM)"
            exit 1
          fi
          echo "All versions match: $PYPROJECT"

  test:
    runs-on: ${{ matrix.os }}
    # Linux finishes in about 2 minutes; a stuck Windows run should not hold a runner for 6 hours.
    timeout-minutes: 30
    strategy:
      # One OS failing must not cancel the others; each cell reports on its own.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev --extra full
      - run: uv run pytest tests/ -v --tb=short --cov=neurostack --cov-report=term-missing

  # A clean machine installing the npm package (issue #238): the path a new
  # user takes. The source tarball is this commit, not main.
  install:
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack the npm package and this commit's source
        run: |
          git archive --format=tar.gz --prefix=neurostack/ -o "$RUNNER_TEMP/source.tar.gz" HEAD
          npm pack ./npm --pack-destination "$RUNNER_TEMP"
      - name: npm install -g
        env:
          NEUROSTACK_SOURCE_TARBALL: ${{ runner.temp }}/source.tar.gz
        run: npm install -g "$RUNNER_TEMP"/neurostack-*.tgz
      # No user systemd bus on Linux runners and no GUI session for launchctl on
      # macOS, so init skips the timer; the Windows step below installs one.
      - name: neurostack init
        run: neurostack init "$RUNNER_TEMP/vault" --yes --mode lite --no-hooks --no-schedule
      - name: neurostack doctor
        run: neurostack doctor
      - name: run-due records one ok decay run
        run: |
          neurostack run-due --job decay --force --json > "$RUNNER_TEMP/run.json"
          cat "$RUNNER_TEMP/run.json"
          node -e '
            const runs = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if (runs.length !== 1 || runs[0].job !== "decay" || runs[0].status !== "ok") {
              console.error("expected one ok decay run"); process.exit(1);
            }' "$RUNNER_TEMP/run.json"
      - name: Task Scheduler install and remove
        if: runner.os == 'Windows'
        run: |
          neurostack schedule install --json
          neurostack schedule status --json | tee "$RUNNER_TEMP/status.json"
          grep -q '"active": true' "$RUNNER_TEMP/status.json"
          neurostack schedule remove --json
