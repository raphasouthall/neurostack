<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeuroStack</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <script>
    // Set the theme before the stylesheet paints, so a dark page never flashes white.
    document.documentElement.dataset.theme = localStorage.getItem('ns_theme')
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <nav class="sidebar" aria-label="Main">
    <div class="logo"><img class="logo-mark" src="logo.svg" alt="">NeuroStack</div>
    <button class="btn menu-btn" id="menu" type="button" aria-label="Menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="nav-label">Vault</div>
    <a class="nav-item" href="#/" data-route="">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
      Overview
    </a>
    <a class="nav-item" href="#/graph" data-route="graph">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="4" cy="4" r="2"/><circle cx="12" cy="5" r="2"/><circle cx="7" cy="12" r="2"/><path d="M5.8 4.3l4.3.5M5 5.8l1.4 4.4M11 6.8l-2.8 3.6"/></svg>
      Graph
    </a>
    <a class="nav-item" href="#/memories" data-route="memories">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5h10v11l-5-3-5 3z"/></svg>
      Memories
    </a>
    <div class="nav-label">System</div>
    <a class="nav-item" href="#/automations" data-route="automations">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg>
      Automations
    </a>
    <a class="nav-item" href="#/settings" data-route="settings">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2"/><circle cx="8" cy="8" r="4.5"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
      Settings
    </a>
    <div class="nav-user" id="user"></div>
    <button class="btn theme-toggle" id="theme" type="button" aria-label="Dark mode" aria-pressed="false">
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </nav>
  <main id="app"></main>
</body>
</html>
