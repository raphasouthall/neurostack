<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeuroStack</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <script>
    // Set the theme before the stylesheet paints, so a dark page never flashes white.
    document.documentElement.dataset.theme = localStorage.getItem('ns_theme')
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- app.js renders the nav, and below 768px its menu opens in a Sheet. -->
  <nav class="sidebar" id="nav" aria-label="Main"></nav>
  <main id="app"></main>
</body>
</html>
